services:
  nginx-proxy:
    image: nginx:1.30-alpine
    container_name: ${STACK_NAME:-wmw}-nginx-proxy
    restart: unless-stopped
    # Publica NGINX no host (debug). No Dokploy o Traefik fala com o container na rede
    # interna na porta 80 — em "Container Port" use 80, nao NGINX_HTTP_PORT.
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    expose:
      - "80"
    environment:
      SERVER_NAME: ${SERVER_NAME}
      APP_UPSTREAM_SCHEME: ${APP_UPSTREAM_SCHEME:-http}
      APP_UPSTREAM_HOST: ${APP_UPSTREAM_HOST}
      APP_UPSTREAM_PORT: ${APP_UPSTREAM_PORT}
      APP_UPSTREAM_PREFIX: ${APP_UPSTREAM_PREFIX:-}
    command: >
      /bin/sh -c "envsubst '$$SERVER_NAME $$APP_UPSTREAM_SCHEME $$APP_UPSTREAM_HOST $$APP_UPSTREAM_PORT $$APP_UPSTREAM_PREFIX'
      < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    volumes:
      - ./nginx/00-forwarded-map.conf:/etc/nginx/conf.d/00-forwarded-map.conf:ro
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/html:/usr/share/nginx/html:ro
